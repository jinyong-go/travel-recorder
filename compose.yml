# 로컬 실행. `docker compose up` 이면 DB·API 서버·프론트엔드와 모니터링(Prometheus 9090, Grafana 3000)이 함께 뜬다.
# 모니터링 없이 앱만 띄우려면 `docker compose up db api web`.
# DB 만 띄우고 IDE·bootRun 으로 API 서버를 돌리려면 `docker compose up db`.
# 프론트엔드를 개발 서버(HMR)로 돌리려면 `docker compose up db api` 후 `npm run dev` (web 과 5173 포트가 겹친다).
# 배치는 잡 하나를 돌리고 끝나는 프로그램이라 상시 서비스로 두지 않는다. 필요하면 Gradle 로 직접 실행한다.
# 데이터는 db-data 볼륨에 남는다. 처음 상태로 되돌리려면 `docker compose down -v`.
# 비밀값(네이버 키, DB 비밀번호)은 루트 `.env` 에 둔다 (`.env.example` 참고). 없으면 기본값으로 뜬다.
services:
  db:
    # 공식 이미지는 amd64 전용이라 arm64 Mac 에서는 에뮬레이션으로 돈다.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      # 볼륨을 처음 만들 때만 적용된다. 바꾼 뒤에는 `docker compose down -v` 로 다시 만들어야 한다.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP 로 확인한다. 첫 기동 때 이미지가 확장을 설치하는 동안에는 임시 서버가 유닉스 소켓으로만 떠 있어,
      # 소켓으로 확인하면 아직 외부 접속을 받지 못하는데도 준비됐다고 나온다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U travel -d travel"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    # environment 로 `${VAR:-}` 를 넘기면 값이 없을 때 빈 문자열이 들어가 Spring 기본값이 무시된다.
    # env_file 은 .env 에 적힌 변수만 넘기므로, 적지 않은 키는 application.yml 의 기본값을 쓴다.
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/travel
    # 관리 포트(8081)는 호스트에 열지 않는다. Prometheus 는 compose 네트워크 안에서 읽는다.
    ports:
      - "8080:8080"
    healthcheck:
      # 실행 이미지(eclipse-temurin)에 curl 이 들어 있다. 첫 기동은 Flyway 적용까지 기다린다.
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3

  web:
    build:
      context: ./frontend
      args:
        # API 는 컨테이너가 아니라 브라우저가 부르므로 VITE_API_BASE_URL 은 기본값(localhost:8080)을 그대로 쓴다.
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:-}
    depends_on:
      - api
    # 백엔드 local 프로파일의 CORS 허용 오리진(http://localhost:5173)과 맞춘다.
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  db-data:
  prometheus-data:
  grafana-data:
