# 테스트 전용. 컨테이너 DB 를 쓰고 초기 데이터는 넣지 않는다. 테스트가 필요한 행을 직접 만든다.
spring:
  datasource:
    url: jdbc:tc:postgis:17-3.5:///travel
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    # 필수 설정이라 비워 둘 수 없다.
    allowed-origins: http://localhost:5173
