# 테스트 전용. local 과 같은 인메모리 H2 를 쓰되 초기 데이터(data-local.sql)는 넣지 않는다.
# 테스트는 각자 필요한 행을 직접 만든다. 초기 데이터가 섞이면 건수·이메일 유니크 조건이 어긋난다.
spring:
  datasource:
    url: jdbc:h2:mem:travel-recorder-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  cors:
    # WebConfig 가 필수로 읽는 값이라 비워 둘 수 없다.
    allowed-origins: http://localhost:5173
