# 운영용.
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    # 마이그레이션은 배포 절차에서 적용하므로 애플리케이션은 돌리지 않는다.
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.yong.travel: INFO
  file:
    # LOG_FILE 로 경로를 바꿀 수 있다.
    name: ${LOG_FILE:./logs/travel-recorder.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      # 디스크가 차지 않도록 로그 보관량을 제한한다.
      total-size-cap: 1GB
