# 로컬 개발용. compose 의 DB 에 붙는다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:travel}

  jpa:
    hibernate:
      # 엔티티와 스키마가 어긋나면 기동에 실패하게 한다.
      ddl-auto: validate

  flyway:
    # 초기 데이터. local 에서만 넣는다.
    locations: classpath:db/migration,classpath:db/seed/local

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.yong.travel: DEBUG
