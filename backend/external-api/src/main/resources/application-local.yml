# 로컬 개발용. 루트 compose.yml 의 PostgreSQL(PostGIS) 에 붙는다.
# `docker compose up db` 로 DB 만 띄우고 bootRun 해도 되고, `docker compose up` 으로 API 서버까지 함께
# 띄워도 된다. 그때는 compose 가 DB_URL 을 컨테이너 안의 주소로 넘긴다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:travel}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. 엔티티와 어긋나면 기동 시점에 실패하도록 validate 를 건다.
      ddl-auto: validate

  flyway:
    # 프론트엔드 목업을 옮긴 초기 데이터. local 에서만 넣는다.
    locations: classpath:db/migration,classpath:db/seed/local

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.yong.travel: DEBUG
