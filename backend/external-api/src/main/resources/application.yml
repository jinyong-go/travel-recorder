# 공통 설정. 환경별로 달라지는 값(데이터소스, 스키마 초기화, CORS, 로깅)은
# application-{local,dev,prod}.yml 에 둔다.
server:
  servlet:
    session:
      cookie:
        http-only: true
        # 모든 프로파일에 Secure 를 건다. 주요 브라우저는 http://localhost 를 보안
        # 컨텍스트로 보아 로컬에서도 받는다. 받지 않는 브라우저로 개발할 때만 false 로 끈다.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  # TLS 를 프록시에서 끝내는 배포에서 Secure 판정·리다이렉트 주소가 맞도록 X-Forwarded-* 를 해석한다.
  # native(Tomcat RemoteIpValve)는 사설망 프록시만 신뢰하므로 외부에서 헤더를 위조해도 반영되지 않는다.
  forward-headers-strategy: native

spring:
  application:
    name: backend

  profiles:
    default: local

  servlet:
    multipart:
      # 사진 업로드 제한. 프론트엔드 VITE_MAX_PHOTO_SIZE_MB / VITE_MAX_PHOTO_TOTAL_MB 와 같은 값을 유지한다.
      max-file-size: ${MAX_PHOTO_SIZE:5MB}
      max-request-size: ${MAX_PHOTO_REQUEST_SIZE:30MB}

  jpa:
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:changeit}
            client-secret: ${NAVER_CLIENT_SECRET:changeit}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

naver:
  # NAVER API HUB(NCP API Gateway) 지역 검색 — 네이버 로그인/NCP Maps 와는 별도의 키다.
  api:
    client-id: ${NAVER_API_CLIENT_ID:changeit}
    client-secret: ${NAVER_API_CLIENT_SECRET:changeit}
    base-url: ${NAVER_API_BASE_URL:https://naverapihub.apigw.ntruss.com/search/v1/local}

app:
  upload:
    # 서비스 레벨 검증 값. 멀티파트 단계 제한과 항상 같도록 그 값을 그대로 따른다.
    max-photo-size: ${spring.servlet.multipart.max-file-size}
    allowed-content-types: ${ALLOWED_PHOTO_CONTENT_TYPES:image/jpeg,image/png,image/webp}

management:
  server:
    # 관리 엔드포인트는 서비스 포트와 나눈다. SecurityConfig 가 permitAll 이라 같은 포트에 두면 외부에
    # 그대로 열린다. 포트를 나누면 배포에서 이 포트를 공개하지 않는 것만으로 막힌다.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      # Grafana 기성 대시보드가 앱을 application 라벨로 구분한다.
      application: ${spring.application.name}
