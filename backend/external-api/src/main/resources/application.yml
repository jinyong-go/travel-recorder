# 공통 설정. 환경별 값은 프로파일 파일에 둔다.
server:
  servlet:
    session:
      cookie:
        http-only: true
        # 주요 브라우저는 localhost 에서도 Secure 쿠키를 받으므로 모든 환경에 건다.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  # 프록시 뒤에서도 원래 주소를 알도록 X-Forwarded-* 를 읽는다. 사설망 프록시만 신뢰해 위조를 막는다.
  forward-headers-strategy: native

spring:
  application:
    name: backend

  profiles:
    default: local

  servlet:
    multipart:
      # 사진 업로드 제한. 프론트엔드 제한값과 맞춘다.
      max-file-size: ${MAX_PHOTO_SIZE:5MB}
      max-request-size: ${MAX_PHOTO_REQUEST_SIZE:30MB}

  jpa:
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:changeit}
            client-secret: ${NAVER_CLIENT_SECRET:changeit}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

naver:
  # 지역 검색 API. 네이버 로그인·지도와는 다른 키다.
  api:
    client-id: ${NAVER_API_CLIENT_ID:changeit}
    client-secret: ${NAVER_API_CLIENT_SECRET:changeit}
    base-url: ${NAVER_API_BASE_URL:https://naverapihub.apigw.ntruss.com/search/v1/local}

app:
  upload:
    # 멀티파트 제한과 같은 값을 쓴다.
    max-photo-size: ${spring.servlet.multipart.max-file-size}
    allowed-content-types: ${ALLOWED_PHOTO_CONTENT_TYPES:image/jpeg,image/png,image/webp}

management:
  server:
    # 관리 엔드포인트는 로그인 없이 열려 있으므로 외부에 공개하지 않을 별도 포트에 둔다.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      # 대시보드가 앱을 구분하는 라벨.
      application: ${spring.application.name}
