# 개발 서버용. PostgreSQL 을 사용하며 접속 정보는 환경 변수로 주입한다.
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  # 마이그레이션은 기동 시 Flyway 가 적용한다 (기본값). 초기 데이터는 넣지 않는다.

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.yong.travel: DEBUG
