# 개발 서버용. 접속 정보는 환경 변수로 받는다.
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  # 기동할 때 마이그레이션을 적용하고 초기 데이터는 넣지 않는다.

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.yong.travel: DEBUG
