# 테스트 전용. Testcontainers 가 PostGIS 컨테이너를 띄우고, 빌드가 external-api 에서 복사해 온
# 마이그레이션(db/migration)을 Flyway 가 적용한다. 배치가 마이그레이션을 직접 돌리는 것은 테스트뿐이다.
spring:
  datasource:
    url: jdbc:tc:postgis:17-3.5:///travel
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  batch:
    job:
      # 기동만으로 잡이 돌면 테스트가 넣은 행보다 먼저 지워진다. 테스트가 직접 실행한다.
      enabled: false
