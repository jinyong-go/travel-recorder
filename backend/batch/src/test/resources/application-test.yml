# 테스트 전용. local 과 같은 인메모리 H2 를 쓰되 이름을 나눠 다른 컨텍스트와 섞이지 않게 한다.
spring:
  datasource:
    url: jdbc:h2:mem:travel-recorder-batch-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  batch:
    job:
      # 기동만으로 잡이 돌면 테스트가 넣은 행보다 먼저 지워진다. 테스트가 직접 실행한다.
      enabled: false
