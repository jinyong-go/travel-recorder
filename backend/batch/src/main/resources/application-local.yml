# 로컬 개발용. 인메모리 H2 를 PostgreSQL 호환 모드로 띄우고 external-api 와 같은 schema.sql 로 만든다.
# API 서버의 인메모리 DB 와는 다른 프로세스라 그 데이터는 보이지 않는다 — 잡이 도는지만 확인하는 자리다.
spring:
  datasource:
    url: jdbc:h2:mem:travel-recorder-batch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.yong.travel: DEBUG
