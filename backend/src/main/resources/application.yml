spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  datasource:
    url: jdbc:h2:mem:travel-recorder
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:changeit}
            client-secret: ${NAVER_CLIENT_SECRET:changeit}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

naver:
  # 네이버 검색 오픈API(지역 검색) — 네이버 로그인/NCP Maps 와는 별도의 키다.
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:changeit}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:changeit}
    base-url: https://openapi.naver.com/v1/search/local.json

app:
  storage:
    type: filesystem
    local:
      root-dir: ./uploads
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.yong.travel: DEBUG
