# 공통 설정. 환경별로 달라지는 값(데이터소스, 스키마 초기화, CORS, 로깅)은
# application-{local,dev,prod}.yml 에 둔다.
spring:
  application:
    name: backend

  profiles:
    default: local

  servlet:
    multipart:
      # 사진 업로드 제한. 프론트엔드 VITE_MAX_PHOTO_SIZE_MB / VITE_MAX_PHOTO_TOTAL_MB 와 같은 값을 유지한다.
      max-file-size: ${MAX_PHOTO_SIZE:5MB}
      max-request-size: ${MAX_PHOTO_REQUEST_SIZE:30MB}

  jpa:
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:changeit}
            client-secret: ${NAVER_CLIENT_SECRET:changeit}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

naver:
  # 네이버 검색 오픈API(지역 검색) — 네이버 로그인/NCP Maps 와는 별도의 키다.
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:changeit}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:changeit}
    base-url: https://openapi.naver.com/v1/search/local.json

app:
  upload:
    # 서비스 레벨 검증 값. spring.servlet.multipart.max-file-size 와 같은 값을 유지한다.
    max-photo-size: ${MAX_PHOTO_SIZE:5MB}
    allowed-content-types: ${ALLOWED_PHOTO_CONTENT_TYPES:image/jpeg,image/png,image/webp}
  storage:
    type: filesystem
